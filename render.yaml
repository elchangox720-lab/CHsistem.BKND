services:
  - type: web
    name: chsistem-bknd
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: MONGODB_DB
        value: chsistem
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
